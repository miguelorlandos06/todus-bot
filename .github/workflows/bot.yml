name: ToDus Bot
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
concurrency:
  group: todus-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TODUS_PHONE:  ${{ secrets.TODUS_PHONE }}
          PYTHONUNBUFFERED: "1"
        run: timeout 355m python bot.py || true
